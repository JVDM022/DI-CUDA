[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "emsoft-di"
version = "0.1.0"
description = "Batched GPU dictionary matching based on EMsoft"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
cuda12 = ["cupy-cuda12x>=13"]
cuda13 = ["cupy-cuda13x>=14"]
hpc = ["kikuchipy==0.13.1", "h5py>=3.8", "scipy>=1.7", "diffpy.structure>=3.5,<4"]

[tool.setuptools.packages.find]
where = ["src"]
